<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who Wants to Be a Retiree?</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #111a4e 0%, #05071a 70%, #02030a 100%);
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* FULL-PAGE TITLE SLIDE */
    #title-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #05071a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      cursor: pointer;
    }

    .title-image-full {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Fill whole page edge-to-edge */
      object-position: center;
    }

    .start-prompt {
      position: absolute;
      bottom: 30px;
      background: rgba(13, 24, 76, 0.85);
      border: 2px solid #ffd700;
      color: #ffd700;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    /* MAIN STAGE */
    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 50px;
      background: radial-gradient(circle at center, #1b266d 0%, #070a24 65%, #010208 100%);
    }

    .meta-bar {
      position: absolute;
      top: 30px;
      font-size: 28px;
      font-weight: bold;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    /* TV METALLIC LOZENGE SHAPES */
    .lozenge-outer {
      background: linear-gradient(180deg, #8b9dc3 0%, #ffffff 50%, #4a5c80 100%);
      padding: 3px;
      clip-path: polygon(28px 0%, calc(100% - 28px) 0%, 100% 50%, calc(100% - 28px) 100%, 28px 100%, 0% 50%);
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      transition: all 0.3s ease;
    }

    .lozenge-inner {
      background: linear-gradient(180deg, #0a133f 0%, #030617 50%, #0a164c 100%);
      clip-path: polygon(26px 0%, calc(100% - 26px) 0%, 100% 50%, calc(100% - 26px) 100%, 26px 100%, 0% 50%);
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 0 35px;
    }

    /* QUESTION BOX */
    .question-wrapper {
      width: 90vw;
      max-width: 1100px;
      height: 110px;
      margin-bottom: 25px;
    }

    .question-text {
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      width: 100%;
      color: #ffffff;
      line-height: 1.3;
    }

    /* OPTIONS GRID */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      width: 90vw;
      max-width: 1100px;
    }

    .option-wrapper {
      height: 75px;
    }

    .option-content {
      font-size: 24px;
      font-weight: 500;
    }

    .opt-label {
      color: #ff9d00;
      font-weight: bold;
      margin-right: 12px;
    }

    .opt-value {
      color: #ffffff;
    }

    /* CORRECT REVEAL ANIMATION */
    .correct-reveal .lozenge-outer {
      background: linear-gradient(180deg, #2ecc71 0%, #ffffff 50%, #1e8449 100%) !important;
      animation: glowPulse 1s infinite alternate;
    }

    .correct-reveal .lozenge-inner {
      background: linear-gradient(180deg, #196f3d 0%, #0e3a20 50%, #1e8449 100%) !important;
    }

    .correct-reveal .opt-label,
    .correct-reveal .opt-value {
      color: #ffffff !important;
      text-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    @keyframes glowPulse {
      from { filter: drop-shadow(0 0 10px #2ecc71); }
      to { filter: drop-shadow(0 0 25px #2ecc71); }
    }

    /* END SCREEN */
    #end-screen {
      display: none;
      text-align: center;
    }

    #quiz-stage { display: none; }
  </style>
</head>
<body>

  <!-- FULL-PAGE TITLE SLIDE -->
  <div id="title-screen" onclick="handlePresentationClick()">
    <img src="title.jpg" alt="Title Slide" class="title-image-full" onerror="this.style.display='none'; document.getElementById('fallback-title').style.display='block';">
    <div id="fallback-title" style="display:none; font-size:48px; color:#ffd700; font-weight:bold;">WHO WANTS TO BE A RETIREE?</div>
    <div class="start-prompt">CLICK OR PRESS SPACEBAR TO START SHOW</div>
  </div>

  <!-- TV QUIZ STAGE -->
  <div id="quiz-stage" class="stage" onclick="handlePresentationClick()">
    <div id="progress" class="meta-bar">Question 1</div>

    <!-- QUESTION BOX -->
    <div class="lozenge-outer question-wrapper">
      <div class="lozenge-inner">
        <div id="question-text" class="question-text">Loading question...</div>
      </div>
    </div>

    <!-- 4 OPTION BOXES -->
    <div class="options-grid">
      <div id="box-A" class="lozenge-outer option-wrapper">
        <div class="lozenge-inner option-content">
          <span class="opt-label">• A:</span><span id="text-A" class="opt-value"></span>
        </div>
      </div>
      <div id="box-B" class="lozenge-outer option-wrapper">
        <div class="lozenge-inner option-content">
          <span class="opt-label">• B:</span><span id="text-B" class="opt-value"></span>
        </div>
      </div>
      <div id="box-C" class="lozenge-outer option-wrapper">
        <div class="lozenge-inner option-content">
          <span class="opt-label">• C:</span><span id="text-C" class="opt-value"></span>
        </div>
      </div>
      <div id="box-D" class="lozenge-outer option-wrapper">
        <div class="lozenge-inner option-content">
          <span class="opt-label">• D:</span><span id="text-D" class="opt-value"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="end-screen" class="stage" onclick="location.reload()">
    <h1 style="font-size: 56px; color: #ffd700; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,215,0,0.6);">QUIZ COMPLETED!</h1>
    <p style="font-size: 28px; color: #ccc;">Thank you for playing!</p>
    <div class="start-prompt" style="position:relative; margin-top:40px;">CLICK TO RESTART</div>
  </div>

  <!-- External Questions File -->
  <script src="questions.js"></script>

  <script>
    // State Engine: TITLE -> QUESTION_HIDDEN -> QUESTION_REVEALED -> END
    let currentState = 'TITLE';
    let currentIndex = 0;

    // Audio Files
    const sounds = {
      opening: new Audio('opening.mp3'),
      letsPlay: new Audio('lets-play.mp3'),
      question: new Audio('question.mp3'),
      reveal: new Audio('reveal.mp3'),
      ending: new Audio('ending.mp3')
    };

    sounds.opening.loop = true;
    sounds.question.loop = true;

    function stopAllAudio() {
      Object.values(sounds).forEach(a => {
        try { a.pause(); a.currentTime = 0; } catch(e){}
      });
    }

    // Presentation Click / Remote Control Handler
    function handlePresentationClick() {
      if (currentState === 'TITLE') {
        startQuiz();
      } else if (currentState === 'QUESTION_HIDDEN') {
        revealAnswer();
      } else if (currentState === 'QUESTION_REVEALED') {
        nextQuestion();
      }
    }

    // Keyboard controls (Spacebar, Enter, Right Arrow)
    window.addEventListener('keydown', function(e) {
      if (['Space', 'Enter', 'ArrowRight'].includes(e.code) || e.keyCode === 32) {
        e.preventDefault();
        handlePresentationClick();
      }
    });

    function startQuiz() {
      stopAllAudio();
      sounds.letsPlay.play().catch(()=>{});

      document.getElementById('title-screen').style.display = 'none';
      document.getElementById('quiz-stage').style.display = 'flex';

      setTimeout(() => {
        loadQuestion(0);
      }, 2500);
    }

    function loadQuestion(index) {
      if (index >= quizQuestions.length) {
        finishQuiz();
        return;
      }

      currentIndex = index;
      currentState = 'QUESTION_HIDDEN';
      clearHighlights();

      stopAllAudio();
      sounds.question.play().catch(()=>{});

      const q = quizQuestions[currentIndex];
      document.getElementById('progress').innerText = `Question ${currentIndex + 1} of ${quizQuestions.length}`;
      document.getElementById('question-text').innerText = q.question;
      document.getElementById('text-A').innerText = q.options.A;
      document.getElementById('text-B').innerText = q.options.B;
      document.getElementById('text-C').innerText = q.options.C;
      document.getElementById('text-D').innerText = q.options.D;
    }

    function revealAnswer() {
      currentState = 'QUESTION_REVEALED';
      stopAllAudio();
      sounds.reveal.play().catch(()=>{});

      const q = quizQuestions[currentIndex];
      const correctOpt = q.answer.toUpperCase();
      const targetBox = document.getElementById('box-' + correctOpt);

      if (targetBox) {
        targetBox.classList.add('correct-reveal');
      }
    }

    function nextQuestion() {
      loadQuestion(currentIndex + 1);
    }

    function clearHighlights() {
      ['A', 'B', 'C', 'D'].forEach(opt => {
        document.getElementById('box-' + opt).classList.remove('correct-reveal');
      });
    }

    function finishQuiz() {
      currentState = 'END';
      stopAllAudio();
      sounds.ending.play().catch(()=>{});

      document.getElementById('quiz-stage').style.display = 'none';
      document.getElementById('end-screen').style.display = 'flex';
    }
  </script>
</body>
</html>
