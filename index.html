<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Quiz Show</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0826;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    /* TITLE SCREEN */
    #title-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0826;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    /* INITIAL CLICK OVERLAY FOR AUDIO */
    #audio-unlock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 8, 38, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
    }

    .title-graphic {
      max-width: 90vw;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      margin-bottom: 20px;
    }

    .btn-main {
      background: #ffd700;
      color: #0d0826;
      border: none;
      padding: 18px 45px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .btn-main:hover {
      background: #e6c200;
      transform: scale(1.03);
    }

    /* QUIZ SCREEN */
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .meta-info {
      font-size: 24px;
      color: #ffd700;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .question-box {
      border: 2px solid #3a4a9f;
      background: #121945;
      padding: 30px;
      border-radius: 12px;
      font-size: 26px;
      margin-bottom: 25px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .option-btn {
      background: #1a235a;
      border: 2px solid #4d5dbf;
      color: white;
      padding: 20px;
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }
    .option-btn:hover:not(:disabled) {
      background: #d47a00;
    }
    .correct-choice {
      background: #1b7e36 !important;
      border-color: #27ae60 !important;
    }
    .wrong-choice {
      background: #a92020 !important;
      border-color: #e74c3c !important;
    }
    #feedback-area {
      margin-top: 25px;
      min-height: 90px;
    }
    #feedback-text {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    #quiz-screen, #end-screen, #next-btn { display: none; }
  </style>
</head>
<body>

  <!-- TITLE SCREEN -->
  <div id="title-screen">
    <!-- Overlay prompt to guarantee sound unlocks -->
    <div id="audio-unlock-overlay" onclick="unlockAudio()">
      <p style="font-size: 32px; color: #ffd700; margin-bottom: 10px; font-weight: bold;">🔊 CLICK ANYWHERE TO START MUSIC</p>
      <p style="font-size: 18px; color: #aaa;">(Enables opening theme music on title screen)</p>
    </div>

    <img src="https://lh3.googleusercontent.com/d/1cxjwOxjMY7K4npWSxeQAQe02pH86970p" alt="Quiz Show Title" class="title-graphic">
    <button id="start-btn" class="btn-main" onclick="startQuiz()">Start Quiz</button>
  </div>

  <!-- QUIZ CONTAINER -->
  <div class="container">
    <div id="quiz-screen">
      <div id="progress" class="meta-info">Question 1</div>
      <div id="question" class="question-box">Loading...</div>
      
      <div class="options-grid">
        <button class="option-btn" id="btnA" onclick="checkAnswer('A')"></button>
        <button class="option-btn" id="btnB" onclick="checkAnswer('B')"></button>
        <button class="option-btn" id="btnC" onclick="checkAnswer('C')"></button>
        <button class="option-btn" id="btnD" onclick="checkAnswer('D')"></button>
      </div>

      <div id="feedback-area">
        <div id="feedback-text"></div>
        <button id="next-btn" class="btn-main" onclick="nextQuestion()">Next Question ➔</button>
      </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen">
      <h1 style="color: #ffd700; font-size: 42px;">Quiz Completed!</h1>
      <p style="font-size: 24px; color: #aaa;" id="final-score"></p>
      <button class="btn-main" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <!-- Load Questions File -->
  <script src="questions.js"></script>

  <script>
    let currentIndex = 0;
    let score = 0;
    let audioUnlocked = false;

    // Local Audio Objects
    const sounds = {
      opening: new Audio('opening.mp3'),
      letsPlay: new Audio('lets-play.mp3'),
      question: new Audio('question.mp3'),
      reveal: new Audio('reveal.mp3'),
      ending: new Audio('ending.mp3')
    };

    sounds.opening.loop = true;
    sounds.question.loop = true;

    function stopAllAudio() {
      Object.values(sounds).forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
      });
    }

    // Step 1: Unlock audio and start theme music
    function unlockAudio() {
      if (!audioUnlocked) {
        audioUnlocked = true;
        document.getElementById('audio-unlock-overlay').style.display = 'none';
        sounds.opening.play().catch(err => console.log('Audio error:', err));
      }
    }

    // Step 2: Stop theme music and start quiz transition
    function startQuiz() {
      if (!audioUnlocked) {
        unlockAudio();
      }

      stopAllAudio();
      sounds.letsPlay.play().catch(() => {});

      document.getElementById('start-btn').disabled = true;
      document.getElementById('start-btn').innerText = 'Get Ready...';

      setTimeout(() => {
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
      }, 3000);
    }

    function showQuestion() {
      if (currentIndex >= quizQuestions.length) {
        finishQuiz();
        return;
      }

      resetOptionButtons();
      document.getElementById('feedback-text').innerText = '';
      document.getElementById('next-btn').style.display = 'none';

      stopAllAudio();
      sounds.question.play().catch(() => {});

      const q = quizQuestions[currentIndex];
      document.getElementById('progress').innerText = `Question ${currentIndex + 1} of ${quizQuestions.length}`;
      document.getElementById('question').innerText = q.question;
      document.getElementById('btnA').innerText = `A: ${q.options.A}`;
      document.getElementById('btnB').innerText = `B: ${q.options.B}`;
      document.getElementById('btnC').innerText = `C: ${q.options.C}`;
      document.getElementById('btnD').innerText = `D: ${q.options.D}`;
    }

    function checkAnswer(selected) {
      stopAllAudio();
      sounds.reveal.play().catch(() => {});

      const q = quizQuestions[currentIndex];
      const isCorrect = (selected === q.answer.toUpperCase());

      if (isCorrect) score++;

      ['A', 'B', 'C', 'D'].forEach(opt => {
        const btn = document.getElementById('btn' + opt);
        btn.disabled = true;
        if (opt === q.answer.toUpperCase()) {
          btn.classList.add('correct-choice');
        } else if (opt === selected && !isCorrect) {
          btn.classList.add('wrong-choice');
        }
      });

      const feedback = document.getElementById('feedback-text');
      if (isCorrect) {
        feedback.style.color = '#27ae60';
        feedback.innerText = 'Correct!';
      } else {
        feedback.style.color = '#e74c3c';
        feedback.innerText = `Wrong! Correct answer was ${q.answer}`;
      }

      const nextBtn = document.getElementById('next-btn');
      nextBtn.innerText = (currentIndex === quizQuestions.length - 1) ? 'See Final Score ➔' : 'Next Question ➔';
      nextBtn.style.display = 'inline-block';
    }

    function nextQuestion() {
      currentIndex++;
      showQuestion();
    }

    function resetOptionButtons() {
      ['A', 'B', 'C', 'D'].forEach(opt => {
        const btn = document.getElementById('btn' + opt);
        btn.disabled = false;
        btn.className = 'option-btn';
      });
    }

    function finishQuiz() {
      stopAllAudio();
      sounds.ending.play().catch(() => {});

      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('end-screen').style.display = 'block';
      document.getElementById('final-score').innerText = `You scored ${score} out of ${quizQuestions.length}!`;
    }
  </script>
</body>
</html>
